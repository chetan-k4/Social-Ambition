<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Ambition Labs</title>
<meta name="description" content="An impact-focused lab using reason, science and technology to solve problems at the scale of whole societies.">
<meta property="og:title" content="Social Ambition Labs">
<meta property="og:description" content="An impact-focused lab using reason, science and technology to solve problems at the scale of whole societies.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://socialambitionlabs.com">
<meta name="theme-color" content="#F4F3EF">
<link rel="icon" href="/labs/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/BricolageGrotesque-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/SourceSerif4-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("/fonts/BricolageGrotesque-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Source Serif 4"; src: url("/fonts/SourceSerif4-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }

  :root {
    color-scheme: light dark;
    --paper: #F4F3EF;
    --ink: #14243A;
    --ink-muted: #4F5D6B;
    --rule: #D6D9D4;
    --accent: #2347C5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F1820;
      --ink: #E6EDEF;
      --ink-muted: #9EB0BB;
      --rule: #243440;
      --accent: #93ABFF;
    }
  }
  :root[data-theme="dark"] { --paper: #0F1820; --ink: #E6EDEF; --ink-muted: #9EB0BB; --rule: #243440; --accent: #93ABFF; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    width: 100%; max-width: 960px; margin: 0 auto; padding: 96px 24px;
  }
  h1 {
    margin: 0 0 24px; font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-weight: 700; font-size: clamp(40px, 7vw, 72px); line-height: 1.02; letter-spacing: -0.025em;
  }
  p.line { margin: 0; max-width: 36ch; font-size: clamp(20px, 2.6vw, 28px); line-height: 1.4; color: var(--ink-muted); }
  footer {
    width: 100%; max-width: 960px; margin: 0 auto; padding: 24px;
    border-top: 1px solid var(--rule);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>Social Ambition Labs</h1>
  <p class="line">An impact-focused lab using reason, science and technology to solve problems at the scale of whole societies.</p>
</main>
<footer>
  <span>Social Ambition Labs</span>
  <span>Now running: <a href="https://solvable.socialambitionlabs.com">Solvable, Dubai</a></span>
</footer>
</body>
</html>
